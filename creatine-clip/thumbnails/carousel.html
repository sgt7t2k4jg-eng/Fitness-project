<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>BRO SPLIT carousel</title>
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(../fonts/cairo-arabic-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../fonts/cairo-arabic-900-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../fonts/cairo-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
  :root { --gold: #f3c14b; --ink: #0b0d10; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: Cairo, sans-serif; font-weight: 900; color: #fff;
           background: radial-gradient(1000px 700px at 50% 22%, rgba(243,193,75,.09), transparent 70%), linear-gradient(180deg, #0b0b0c 0%, #050505 100%); }
  #stage::before { content: ''; position: absolute; inset: 0; opacity: .35;
    background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px); background-size: 54px 54px; }
  .abs { position: absolute; }
  .goldtxt { background: linear-gradient(180deg, #ffe7a3 0%, #f3c14b 45%, #b8862b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lat { direction: ltr; }

  /* brand: small Instagram logo + handle, top corner of every slide */
  #brand { right: 46px; top: 38px; display: flex; align-items: center; gap: 14px; direction: ltr; }
  #brand span { font-size: 32px; color: rgba(255,255,255,.9); font-weight: 700; padding-bottom: 4px; }
  #count { left: 46px; top: 46px; font-size: 28px; color: rgba(255,255,255,.45); direction: ltr; font-weight: 700; }

  /* slide 1 — hook + week */
  .hook1 { left: 0; width: 1080px; top: 140px; text-align: center; font-size: 74px; line-height: 1.25; }
  .hook2 { left: 0; width: 1080px; top: 350px; display: flex; justify-content: center; align-items: baseline; gap: 26px; }
  .hook2 .a { font-size: 74px; }
  .hook2 .b { font-size: 120px; line-height: 1.1; direction: ltr; letter-spacing: 2px; }
  .frame { left: 70px; width: 940px; top: 545px; padding: 24px 24px; border-radius: 40px; border: 4px solid rgba(243,193,75,.55);
           background: rgba(20,20,22,.85); display: flex; flex-direction: column; gap: 10px; }
  .wk { position: relative; height: 86px; border-radius: 24px; background: #141416; border: 3px solid rgba(255,255,255,.08);
        display: flex; align-items: center; padding: 0 34px 6px; gap: 26px; }
  .wk::before { content: ''; position: absolute; right: 0; top: 20px; bottom: 20px; width: 8px; border-radius: 4px; background: var(--gold); }
  .wk .d { width: 200px; flex: none; font-size: 48px; }
  .wk .w { font-size: 44px; white-space: nowrap; }
  .wk.rest { background: #0e0e10; }
  .wk.rest::before { background: #3a3a3f; }
  .wk.rest .w { color: rgba(255,255,255,.5); }
  .swipe { left: 0; width: 1080px; bottom: 26px; text-align: center; font-size: 30px; color: rgba(255,255,255,.5); font-weight: 700; }

  .hook1.small { top: 120px; font-size: 62px; line-height: 1.3; }
  .hook2.low { top: 385px; }
  .hook2.low .b { font-size: 104px; }
  .frame.big { top: 590px; gap: 18px; padding: 30px; }
  .frame.big .wk { height: 140px; border-radius: 30px; }
  .frame.big .wk .d { width: 260px; font-size: 62px; }
  .frame.big .wk .w { font-size: 72px; color: var(--gold); }
  .w.lat { direction: ltr; }
  .otitle.high { top: 105px; }
  .ocard.wrap { top: 290px; padding: 34px 46px 38px; }
  .ocard.wrap p { white-space: normal; font-size: 42px; line-height: 1.5; }
  .cta.low { top: 1050px; height: 230px; }
  .ocard.wrap p + p { margin-top: 18px; padding-top: 18px; border-top: 2px solid rgba(255,255,255,.08); }
  /* session slides (same look as the video day pages) */
  .dchip { left: 0; width: 1080px; top: 116px; display: flex; justify-content: center; }
  .dchip span { height: 66px; padding: 0 34px 6px; border-radius: 33px; border: 4px solid var(--gold); color: var(--gold); font-size: 40px; line-height: 56px; }
  .ptitle { left: 0; width: 1080px; top: 186px; text-align: center; font-size: 84px; line-height: 1.15; direction: ltr; white-space: nowrap; }
  .psub { left: 0; width: 1080px; top: 284px; text-align: center; font-size: 46px; }
  .glabel { left: 70px; width: 940px; height: 46px; display: flex; align-items: center; gap: 18px; direction: ltr;
            color: var(--gold); font-size: 28px; letter-spacing: 4px; }
  .glabel::after { content: ''; flex: 1; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(243,193,75,.6), transparent); }
  .xrow { left: 56px; width: 968px; height: 104px; border-radius: 22px; background: #141416; border: 3px solid rgba(255,255,255,.08);
          display: flex; align-items: center; direction: ltr; gap: 24px; padding: 0 20px 0 8px; }
  .xrow .ph { position: relative; width: 168px; height: 92px; border-radius: 16px; overflow: hidden; flex: none; background: #222; }
  .xrow .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .xrow .no { font-size: 30px; color: var(--gold); width: 46px; flex: none; }
  .xrow .nm { font-size: 42px; white-space: nowrap; }

  /* last slide — opinion + call to action */
  .otitle { left: 0; width: 1080px; top: 170px; text-align: center; font-size: 92px; }
  .ocard { left: 70px; width: 940px; top: 340px; padding: 40px 50px 46px; border-radius: 40px; background: #141416; border: 3px solid rgba(255,255,255,.1); }
  .ocard p { font-size: 48px; line-height: 1.5; white-space: nowrap; }
  .ocard p + p { margin-top: 18px; }
  .ocard .g { color: var(--gold); }
  .opts { left: 70px; width: 940px; top: 660px; display: flex; gap: 30px; }
  .opt { flex: 1; height: 250px; border-radius: 36px; border: 5px solid var(--gold); background: rgba(243,193,75,.07);
         display: flex; flex-direction: column; align-items: center; justify-content: center; direction: ltr; }
  .opt b { font-size: 96px; line-height: 1.1; }
  .opt small { font-size: 32px; color: rgba(255,255,255,.75); font-weight: 700; }
  .cta { left: 70px; width: 940px; top: 960px; height: 250px; border-radius: 36px; background: linear-gradient(180deg, #ffe08a, #e3a92f);
         color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .cta .t { font-size: 54px; }
  .cta .i { display: flex; gap: 46px; direction: rtl; }
  .cta .i div { display: flex; align-items: center; gap: 12px; font-size: 44px; }
</style>
</head>
<body>
<div id="stage">
  <div id="brand" class="abs">
    <svg width="54" height="54" viewBox="0 0 64 64"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/><stop offset=".3" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#ig)"/>
      <rect x="15" y="15" width="34" height="34" rx="10" fill="none" stroke="#fff" stroke-width="4.5"/>
      <circle cx="32" cy="32" r="8" fill="none" stroke="#fff" stroke-width="4.5"/><circle cx="42.5" cy="21.5" r="2.8" fill="#fff"/></svg>
    <span>@yassinerahou3</span>
  </div>
  <div id="content"></div>
</div>

<script src="../shared/kit.js"></script>
<script>
  // ?set=bro (BRO SPLIT, default) or ?set=ul (UPPER / LOWER): loads that video's program data
  const SET = new URLSearchParams(location.search).get('set') || 'bro';
  document.write(`<script src="../clips/${SET === 'ul' ? '07-upper-lower' : '06-bro-split'}/timeline.js"><\/script>`);
</script>
<script>
const root = document.getElementById('content');
const el = (cls, html, style = {}) => { const d = document.createElement('div'); d.className = 'abs ' + cls; d.innerHTML = html; Object.assign(d.style, style); root.appendChild(d); return d; };
const ICON = {
  like: '<svg width="50" height="50" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.7 12 21 12 21z" fill="#e0245e"/></svg>',
  follow: '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
  comment: '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
  save: '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
};
const cta = (items) => el('cta', `<div class="t">إلى عجبك البوسط</div><div class="i">${items.map(([k, w]) => `<div>${ICON[k]}${w}</div>`).join('')}</div>`);

const TRAIN = TL.pages.filter((p) => !p.rest);
const CFG = {
  bro: {
    hook: () => {
      el('hook1', 'كتقلب على بروغرام<br>تريني بيه؟');
      el('hook2', '<span class="a">كاين</span><span class="b goldtxt">BRO SPLIT</span>');
      return [['الإثنين', 'الصدر والترايسبس'], ['الثلاثاء', 'الظهر والبايسبس'], ['الأربعاء', 'الرجلين'], ['الخميس', 'راحة'],
              ['الجمعة', 'الكتاف'], ['السبت', 'الذراعين والبطن'], ['الأحد', 'راحة']];
    },
    day: (p, i) => {
      const T = { 'SHOULDERS + TRAPS': ['SHOULDERS', 'الكتاف'], 'ARMS + ABS': ['ARMS + ABS', 'الذراعين والبطن'] }[p.en] || [p.en, p.ar];
      return [['الإثنين', 'الثلاثاء', 'الأربعاء', 'الجمعة', 'السبت'][i], ...T];
    },
    opinion: () => {
      el('ocard', `<p><span class="g">BRO SPLIT</span> ماشي صالح لكاع الناس.</p><p>إلا كنتي باقي بادي، كاين ما حسن منو:</p>`);
      el('opts', `<div class="opt"><b class="goldtxt">PPL</b><small>PUSH · PULL · LEGS</small></div><div class="opt"><b class="goldtxt" style="font-size:58px; white-space:nowrap">UPPER / LOWER</b></div>`);
      cta([['like', 'لايك'], ['follow', 'فلو'], ['comment', 'كومنت']]);
    },
  },
  ul: {
    hook: () => {
      el('hook1 small', 'كتقلب على بروغرام فيه غير 4 أيام<br>وتخدم بيه العضلات<br>جوج مرات فالسيمانة؟');
      el('hook2 low', '<span class="a">كاين</span><span class="b goldtxt">UPPER / LOWER</span>');
      return TRAIN.map((p) => [p.chip, p.en, 'lat']);
    },
    day: (p) => [p.chip, p.en, p.ar],
    opinion: () => {
      el('ocard wrap', `<p><span class="g">UPPER / LOWER</span> من أحسن البرامج إلا كان عندك غير 4 أيام فالسيمانة.</p>
        <p>كتخدم كل عضلة جوج مرات، وكتبقى عندك راحة كافية بين الحصص.</p>
        <p>صالح للناس اللي بادين، وحتى اللي عندهم شوية ديال الخبرة.</p>
        <p>المهم: <span class="g">كون منتظم</span>، وزيد شوية فالتقل ولا فالريبات كل سيمانة.</p>`);
      cta([['like', 'لايك'], ['follow', 'فلو'], ['comment', 'كومنت'], ['save', 'سيف']]);
      document.querySelector('.cta').classList.add('low');
    },
  },
}[SET];
const N = 2 + TRAIN.length;
const slide = +(new URLSearchParams(location.search).get('slide') || 1);

if (slide === 1) {
  const week = CFG.hook();
  el('frame' + (SET === 'ul' ? ' big' : ''), week.map(([d, w, cls]) => `<div class="wk${w === 'راحة' ? ' rest' : ''}"><div class="d goldtxt">${d}</div><div class="w ${cls || ''}">${w}</div></div>`).join(''));
} else if (slide <= 1 + TRAIN.length) {
  const p = TRAIN[slide - 2];
  const [chip, en, ar] = CFG.day(p, slide - 2);
  el('dchip', `<span>${chip}</span>`);
  el('ptitle goldtxt', en);
  el('psub', ar);
  // fit every exercise row on the 1350px slide
  const n = p.groups.reduce((a, g) => a + g[1].length, 0), L = p.groups.length;
  const pitch = Math.min(112, Math.floor((938 - L * 48) / n));
  let y = 362, k = 0;
  p.groups.forEach(([label, list]) => {
    el('glabel', label, { top: y + 'px' }); y += 48;
    list.forEach((x) => {
      // end-position photo shows the movement best (Plank has one photo)
      const src = x.frames[x.frames.length - 1].replace('../../', '../');
      el('xrow', `<div class="ph" style="height:${pitch - 20}px"><img src="${src}"></div><div class="no">${String(++k).padStart(2, '0')}</div><div class="nm">${x.name}</div>`,
         { top: y + 'px', height: pitch - 8 + 'px' });
      y += pitch;
    });
  });
} else {
  el('otitle goldtxt' + (SET === 'ul' ? ' high' : ''), 'رأيي فهاد البرنامج');
  CFG.opinion();
}
window.N = N;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode())]);
</script>
</body>
</html>
