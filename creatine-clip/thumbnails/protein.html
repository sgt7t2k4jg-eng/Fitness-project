<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Top 5 protein sources</title>
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(../fonts/cairo-arabic-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../fonts/cairo-arabic-900-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../fonts/cairo-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
  :root { --or: #f0873a; --or2: #ff9f4d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: Cairo, sans-serif; font-weight: 900; color: #fff;
           background: radial-gradient(700px 420px at 50% 0%, rgba(240,135,58,.22), transparent 70%), #131317; }
  .abs { position: absolute; }

  /* header: counter (left) + handle and photo (right) */
  .count { left: 64px; top: 64px; font-size: 38px; color: rgba(255,255,255,.55); direction: ltr; }
  .who { right: 60px; top: 40px; display: flex; align-items: center; gap: 22px; direction: ltr; }
  .who span { font-size: 40px; padding-bottom: 6px; }
  .who img { width: 96px; height: 96px; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); object-fit: cover; }

  /* inner card */
  .card { left: 60px; top: 160px; width: 960px; height: 1045px; border-radius: 56px; background: #1e1e24;
          display: flex; flex-direction: column; align-items: center; }
  .card .img { width: 210px; height: 210px; margin-top: 36px; }
  .card .img img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 16px 18px rgba(0,0,0,.5)); }
  .card .nm { font-size: 116px; line-height: 1.1; margin-top: 6px; }
  .card .sv { font-size: 44px; line-height: 1.4; color: rgba(255,255,255,.55); }
  .card .big { font-size: 210px; line-height: .95; color: var(--or); direction: ltr; margin-top: 18px; letter-spacing: -4px; }
  .card .lb { font-size: 56px; line-height: 1.3; color: var(--or); }
  .card .pill { margin-top: 22px; height: 100px; padding: 0 56px 8px; border-radius: 50px; background: #2b2b33;
                font-size: 50px; line-height: 92px; white-space: nowrap; }
  .card .pill .l { direction: ltr; display: inline-block; }
  .card .tag { margin-top: 22px; font-size: 42px; line-height: 1.3; color: rgba(255,255,255,.5); font-weight: 700; }

  .swipe { right: 70px; top: 1240px; font-size: 44px; color: var(--or); }
  .note { left: 70px; top: 1252px; font-size: 30px; color: rgba(255,255,255,.35); font-weight: 700; }

  /* cover */
  .cover .t1 { font-size: 110px; margin-top: 230px; }
  .cover .t2 { font-size: 240px; line-height: 1.1; color: var(--or); }
  .cover .icons { display: flex; gap: 26px; margin-top: 60px; direction: rtl; }
  .cover .icons img { width: 120px; height: 120px; object-fit: contain; }

  /* last slide */
  .tip .t { font-size: 120px; color: var(--or); margin-top: 90px; }
  .tip p { font-size: 58px; line-height: 1.5; text-align: center; padding: 0 80px; margin-top: 40px; }
  .tip p b { color: var(--or); }
  .tip .cta { margin-top: auto; margin-bottom: 60px; width: 840px; border-radius: 40px; background: #2b2b33; padding: 34px 0 40px;
              display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .tip .cta .h { font-size: 52px; }
  .tip .cta .i { display: flex; gap: 44px; }
  .tip .cta .i div { display: flex; align-items: center; gap: 12px; font-size: 44px; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div id="stage">
  <div class="abs count"></div>
  <div class="abs who"><span>yassinerahou3</span><img src="photos/avatar.png" onerror="this.style.display='none'"></div>
  <div id="content"></div>
</div>
<script>
// Values are approximate (USDA FoodData Central). Images: Fluent Emoji 3D (MIT); tuna can + sardines edited from it.
const FOODS = [
  { name: 'صدر الدجاج', img: 'chicken', serving: '100g مطيب', p: '31g', kcal: 165, fat: '3.6g', tag: 'قليل الدهون وغني بالبروتين' },
  { name: 'البيض', img: 'egg', serving: 'بيضة وحدة', p: '6g', kcal: 72, fat: '4.8g', tag: 'بروتين كامل وساهل فالطياب' },
  { name: 'الطون', img: 'tuna', serving: '100g مصفي (طون فالما)', p: '26g', kcal: 116, fat: '0.8g', tag: 'إلا كان فالزيت: 198 سعرة و 8g دهون' },
  { name: 'اللحم', img: 'meat', serving: '100g لحم بقري قليل الدهون', p: '26g', kcal: 217, fat: '12g', tag: 'غني بالبروتين والحديد' },
  { name: 'السردين', img: 'sardines', serving: '100g (حك فالزيت، مصفي)', p: '25g', kcal: 208, fat: '11g', tag: 'غني بالأوميغا 3' },
];
const N = FOODS.length + 2;
const slide = +(new URLSearchParams(location.search).get('slide') || 1);
const root = document.getElementById('content');
const add = (cls, html) => { const d = document.createElement('div'); d.className = 'abs ' + cls; d.innerHTML = html; root.appendChild(d); return d; };
document.querySelector('.count').textContent = `${slide}/${N}`;

if (slide === 1) {
  add('card cover', `<div class="t1">أفضل 5 مصادر</div><div class="t2">البروتين</div>
    <div class="icons">${FOODS.map((f) => `<img src="../food3d/${f.img}.png">`).join('')}</div>`);
  add('swipe', 'سوايبي ←');
} else if (slide <= FOODS.length + 1) {
  const f = FOODS[slide - 2];
  add('card', `<div class="img"><img src="../food3d/${f.img}.png"></div><div class="nm">${f.name}</div><div class="sv">${f.serving}</div>
    <div class="big">${f.p}</div><div class="lb">بروتين</div>
    <div class="pill"><span class="l">${f.kcal} kcal</span> · ${f.fat} دهون</div><div class="tag">${f.tag}</div>`);
  add('note', 'القيم تقريبية');
  add('swipe', 'سوايبي ←');
} else {
  const I = {
    like: '<svg width="48" height="48" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.7 12 21 12 21z" fill="#e0245e"/></svg>',
    follow: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
    comment: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
    save: '<svg width="48" height="48" viewBox="0 0 24 24" fill="#f0873a" stroke="#f0873a" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
  };
  add('card tip', `<div class="t">نصيحة</div>
    <p><b>البروتين</b> من بين أهم العناصر الغذائية لبناء العضلات.</p>
    <p>ختار داك الشي اللي عندك.</p>
    <div class="cta"><div class="h">سيف البوسط باش ترجع ليه</div>
      <div class="i"><div>${I.like}لايك</div><div>${I.follow}فلو</div><div>${I.comment}كومنت</div><div>${I.save}سيف</div></div></div>`);
}
window.N = N;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
</body>
</html>
