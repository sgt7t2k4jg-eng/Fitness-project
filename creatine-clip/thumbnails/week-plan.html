<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Week plan</title>
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(../fonts/cairo-arabic-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../fonts/cairo-arabic-900-normal.woff2) format('woff2'); }
  :root { --gold: #f3c14b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; font-family: Cairo, sans-serif; font-weight: 900; color: #fff;
           display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 0 70px;
           background:
             radial-gradient(1000px 800px at 50% 30%, rgba(243,193,75,.08), transparent 70%),
             linear-gradient(180deg, #0b0b0c 0%, #050505 100%); position: relative; }
  #stage::before { content: ''; position: absolute; inset: 0; opacity: .35;
    background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px); background-size: 54px 54px; }
  .row { position: relative; height: 168px; border-radius: 34px; background: #141416; border: 4px solid rgba(255,255,255,.1);
         display: flex; align-items: center; padding: 0 50px 8px; gap: 30px; }
  .row::before { content: ''; position: absolute; right: 0; top: 30px; bottom: 30px; width: 10px; border-radius: 5px; background: var(--gold); }
  .day { font-size: 64px; width: 270px; flex: none;
         background: linear-gradient(180deg, #ffe7a3 0%, #f3c14b 45%, #b8862b 100%);
         -webkit-background-clip: text; background-clip: text; color: transparent; }
  .what { font-size: 58px; white-space: nowrap; }
  .row.rest { background: #0e0e10; }
  .row.rest::before { background: #3a3a3f; }
  .row.rest .what { color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="stage">
  <div class="row"><div class="day">الإثنين</div><div class="what">الصدر والترايسبس</div></div>
  <div class="row"><div class="day">الثلاثاء</div><div class="what">الظهر والبايسبس</div></div>
  <div class="row"><div class="day">الأربعاء</div><div class="what">الرجلين</div></div>
  <div class="row rest"><div class="day">الخميس</div><div class="what">راحة</div></div>
  <div class="row"><div class="day">الجمعة</div><div class="what">الكتاف</div></div>
  <div class="row"><div class="day">السبت</div><div class="what">الذراعين والبطن</div></div>
  <div class="row rest"><div class="day">الأحد</div><div class="what">راحة</div></div>
</div>
<script>window.ready = document.fonts.ready;</script>
</body>
</html>
